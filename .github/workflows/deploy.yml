# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate customer account configuration
        env:
          CUSTOMER_ACCOUNT_CLIENT_ID: 56d89875-9127-4792-b5f6-c67960951dc2
        run: |
          if [ -z "$CUSTOMER_ACCOUNT_CLIENT_ID" ]; then
            echo "::error::Missing repository variable VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID"
            exit 1
          fi
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          # Public OAuth client identifier; it is visible in the browser bundle by design.
          VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: 56d89875-9127-4792-b5f6-c67960951dc2
          VITE_SHOPIFY_CUSTOMER_ACCOUNT_REDIRECT_URI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_SHOPIFY_CUSTOMER_ACCOUNT_LOGOUT_URI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
